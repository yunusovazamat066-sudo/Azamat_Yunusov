<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Estate — a big rich house</title>
<style>
  :root{
    --ink:#1c2430;
    --paper:#fdfbf6;
    --gold:#c9a227;
    --panel-bg: rgba(28,36,48,0.55);
    --panel-border: rgba(255,255,255,0.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f2ece0;
    }
  }
  :root[data-theme="dark"]{ --ink:#f2ece0; }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0b1622; }
  body{ font-family: 'Georgia', 'Iowan Old Style', 'Times New Roman', serif; }

  #canvas-wrap{ position:fixed; inset:0; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  .hud{
    position:fixed; z-index:5; color:var(--paper);
    pointer-events:none;
  }
  .title-block{
    top:22px; left:26px; max-width:min(70vw,420px);
  }
  .title-block h1{
    margin:0 0 4px 0; font-size:clamp(20px,3vw,30px); font-weight:400;
    letter-spacing:0.5px; color:#fdfbf6;
    text-shadow:0 2px 14px rgba(0,0,0,0.45);
  }
  .title-block p{
    margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:12.5px; color:#e7e1d3; opacity:0.8; letter-spacing:0.2px;
    text-shadow:0 1px 8px rgba(0,0,0,0.5);
  }

  .controls-panel{
    bottom:22px; left:26px; pointer-events:auto;
    display:flex; gap:8px; align-items:center;
  }
  .pill-btn{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:13px; color:#fdfbf6; background:var(--panel-bg);
    border:1px solid var(--panel-border); backdrop-filter: blur(6px);
    padding:9px 16px; border-radius:999px; cursor:pointer;
    transition:background 0.2s ease, transform 0.15s ease;
    display:flex; align-items:center; gap:7px;
  }
  .pill-btn:hover{ background:rgba(28,36,48,0.78); transform:translateY(-1px); }
  .pill-btn:active{ transform:translateY(0px); }

  .hint{
    bottom:26px; right:26px; pointer-events:none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:11.5px; color:#e7e1d3; opacity:0.75; text-align:right;
    text-shadow:0 1px 8px rgba(0,0,0,0.5);
  }

  #loading{
    position:fixed; inset:0; z-index:20; background:#0b1622;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#e7e1d3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    transition:opacity 0.6s ease;
  }
  #loading .mark{
    font-size:34px; margin-bottom:14px; letter-spacing:2px; color:#c9a227;
    font-family:'Georgia', serif;
  }
  #loading .msg{ font-size:12.5px; opacity:0.7; letter-spacing:0.5px; }
  #loading.hide{ opacity:0; pointer-events:none; }
</style>
</head>
<body>

<div id="loading">
  <div class="mark">⌂</div>
  <div class="msg">laying the foundations…</div>
</div>

<div id="canvas-wrap"></div>

<div class="hud title-block">
  <h1>The Estate</h1>
  <p>A big, rich house — rendered in three dimensions</p>
</div>

<div class="hud controls-panel">
  <button class="pill-btn" id="toggleTime">🌙 Night</button>
  <button class="pill-btn" id="toggleSpin">⏸ Pause orbit</button>
</div>

<div class="hud hint">Drag to look around · Scroll or pinch to zoom</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  "use strict";

  var wrap = document.getElementById('canvas-wrap');
  var W = window.innerWidth, H = window.innerHeight;

  // ---------- renderer / scene / camera ----------
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  wrap.appendChild(renderer.domElement);

  var scene = new THREE.Scene();

  var camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 500);
  camera.position.set(34, 19, 38);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 5, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.minDistance = 14;
  controls.maxDistance = 85;
  controls.maxPolarAngle = Math.PI * 0.495;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.55;
  controls.update();

  // ---------- sky dome (gradient) ----------
  var skyUniforms = {
    topColor: { value: new THREE.Color(0x6fa8dc) },
    bottomColor: { value: new THREE.Color(0xdfeaf2) },
    offset: { value: 8 },
    exponent: { value: 0.7 }
  };
  var skyGeo = new THREE.SphereGeometry(250, 24, 16);
  var skyMat = new THREE.ShaderMaterial({
    uniforms: skyUniforms,
    vertexShader: [
      "varying vec3 vWorldPosition;",
      "void main() {",
      "  vec4 worldPosition = modelMatrix * vec4( position, 1.0 );",
      "  vWorldPosition = worldPosition.xyz;",
      "  gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );",
      "}"
    ].join("\n"),
    fragmentShader: [
      "uniform vec3 topColor;",
      "uniform vec3 bottomColor;",
      "uniform float offset;",
      "uniform float exponent;",
      "varying vec3 vWorldPosition;",
      "void main() {",
      "  float h = normalize( vWorldPosition + offset ).y;",
      "  gl_FragColor = vec4( mix( bottomColor, topColor, max( pow( max( h, 0.0), exponent ), 0.0 ) ), 1.0 );",
      "}"
    ].join("\n"),
    side: THREE.BackSide
  });
  var sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);

  scene.fog = new THREE.Fog(0xdfeaf2, 60, 220);

  // ---------- lighting ----------
  var hemi = new THREE.HemisphereLight(0xcfe3f5, 0x4a5a3d, 0.65);
  scene.add(hemi);

  var sun = new THREE.DirectionalLight(0xfff3d6, 1.15);
  sun.position.set(-40, 55, 24);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -45;
  sun.shadow.camera.right = 45;
  sun.shadow.camera.top = 45;
  sun.shadow.camera.bottom = -45;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 150;
  sun.shadow.bias = -0.0009;
  scene.add(sun);

  var fill = new THREE.DirectionalLight(0xbcd4ff, 0.28);
  fill.position.set(30, 20, -30);
  scene.add(fill);

  // ---------- helpers ----------
  function mesh(geo, color, opts){
    opts = opts || {};
    var mat = new THREE.MeshStandardMaterial({
      color: color,
      roughness: opts.roughness !== undefined ? opts.roughness : 0.75,
      metalness: opts.metalness !== undefined ? opts.metalness : 0.05
    });
    var m = new THREE.Mesh(geo, mat);
    m.castShadow = opts.castShadow !== false;
    m.receiveShadow = opts.receiveShadow !== false;
    return m;
  }
  function box(w,h,d,color,x,y,z,opts){
    var m = mesh(new THREE.BoxGeometry(w,h,d), color, opts);
    m.position.set(x,y,z);
    return m;
  }
  function cyl(rt,rb,h,color,x,y,z,seg,opts){
    var m = mesh(new THREE.CylinderGeometry(rt,rb,h,seg||16), color, opts);
    m.position.set(x,y,z);
    return m;
  }
  function pyramidRoof(w,h,d,color,x,y,z,opts){
    var geo = new THREE.ConeGeometry(1, h, 4, 1);
    geo.rotateY(Math.PI/4);
    var m = mesh(geo, color, Object.assign({roughness:0.55, metalness:0.15}, opts||{}));
    m.scale.set(w/1.4142, 1, d/1.4142);
    m.position.set(x,y,z);
    return m;
  }
  function group(){ return new THREE.Group(); }

  var estate = group();
  scene.add(estate);

  // ---------- palette ----------
  var WALL   = 0xf1ead9;
  var TRIM   = 0xfffdf7;
  var ROOF   = 0x3c4757;
  var ROOFLO = 0x475269;
  var GOLD   = 0xc9a227;
  var GLASS  = 0x24384a;
  var DOOR   = 0x3d2a1c;
  var STONE  = 0xc7c0ae;
  var DRIVE  = 0xa79f8e;
  var GRASS  = 0x5e8a45;
  var GRASSD = 0x4f7a3a;
  var HEDGE  = 0x33542f;
  var TREE   = 0x2c4a2a;
  var TRUNK  = 0x5c4530;
  var POOL   = 0x2f8ea8;
  var POOLLT = 0x8fd4e0;

  // ---------- ground ----------
  var lawn = mesh(new THREE.CircleGeometry(85, 48), GRASS, {roughness:0.95, castShadow:false});
  lawn.rotation.x = -Math.PI/2;
  lawn.position.y = 0;
  estate.add(lawn);

  var lawnRing = mesh(new THREE.RingGeometry(60, 85, 48), GRASSD, {roughness:0.95, castShadow:false});
  lawnRing.rotation.x = -Math.PI/2;
  lawnRing.position.y = 0.001;
  estate.add(lawnRing);

  // circular driveway
  var driveOuter = mesh(new THREE.RingGeometry(11.5, 16, 40), DRIVE, {roughness:0.9, castShadow:false});
  driveOuter.rotation.x = -Math.PI/2;
  driveOuter.position.set(0, 0.02, 24);
  estate.add(driveOuter);

  var driveApproach = mesh(new THREE.PlaneGeometry(9, 22), DRIVE, {roughness:0.9, castShadow:false});
  driveApproach.rotation.x = -Math.PI/2;
  driveApproach.position.set(0, 0.02, 40);
  estate.add(driveApproach);

  var driveInnerLawn = mesh(new THREE.CircleGeometry(11.3, 40), GRASS, {roughness:0.95, castShadow:false});
  driveInnerLawn.rotation.x = -Math.PI/2;
  driveInnerLawn.position.set(0, 0.03, 24);
  estate.add(driveInnerLawn);

  // fountain
  var fountainGroup = group();
  fountainGroup.add(cyl(3.4, 3.6, 0.9, STONE, 0,0.45,0, 24));
  var fountainWater = mesh(new THREE.CircleGeometry(3.1,24), POOLLT, {roughness:0.15, metalness:0.3, castShadow:false});
  fountainWater.rotation.x = -Math.PI/2;
  fountainWater.position.y = 0.92;
  fountainGroup.add(fountainWater);
  fountainGroup.add(cyl(0.55,0.7,2.1, STONE, 0,1.95,0,16));
  fountainGroup.add(cyl(1.3,1.5,0.4, STONE, 0,2.95,0,20));
  var fountainTop = cyl(0.15,0.4,0.9, GOLD, 0,3.55,0,10,{metalness:0.7, roughness:0.3});
  fountainGroup.add(fountainTop);
  fountainGroup.position.set(0, 0, 24);
  estate.add(fountainGroup);

  // ---------- main house body ----------
  var houseGroup = group();

  // core block
  houseGroup.add(box(15, 6.4, 10, WALL, 0, 3.2, 0));
  houseGroup.add(pyramidRoof(16.4, 4.2, 11.4, ROOF, 0, 6.4+2.1, 0));

  // left & right wings, set slightly back
  houseGroup.add(box(7.5, 4.6, 8.4, WALL, -11.1, 2.3, -0.4));
  houseGroup.add(pyramidRoof(8.6, 3.1, 9.4, ROOFLO, -11.1, 4.6+1.55, -0.4));

  houseGroup.add(box(7.5, 4.6, 8.4, WALL, 11.1, 2.3, -0.4));
  houseGroup.add(pyramidRoof(8.6, 3.1, 9.4, ROOFLO, 11.1, 4.6+1.55, -0.4));

  // base plinth / foundation trim
  houseGroup.add(box(15.3, 0.5, 10.3, STONE, 0, 0.25, 0));
  houseGroup.add(box(7.8, 0.5, 8.7, STONE, -11.1, 0.25, -0.4));
  houseGroup.add(box(7.8, 0.5, 8.7, STONE, 11.1, 0.25, -0.4));

  // chimneys
  houseGroup.add(box(0.9,3.2,0.9, 0x6b4a3a, -12.6, 7.0, -0.4));
  houseGroup.add(box(0.9,3.2,0.9, 0x6b4a3a, 12.6, 7.0, -0.4));

  // ---------- grand portico / entrance ----------
  var porticoZ = 5.05;
  var stepColors = [STONE, STONE, STONE];
  for (var s = 0; s < 3; s++){
    var sw = 8.6 - s*1.1, sd = 1.0, sy = 0.18 + s*0.36;
    houseGroup.add(box(sw, 0.36, 2.4 - s*0.5, stepColors[s], 0, sy, porticoZ + 1.6 + s*0.55));
  }

  var columnXs = [-3.2, -1.6, 1.6, 3.2];
  columnXs.forEach(function(cx){
    houseGroup.add(cyl(0.34, 0.4, 5.6, TRIM, cx, 2.8, porticoZ, 14));
    houseGroup.add(cyl(0.5, 0.5, 0.25, TRIM, cx, 5.72, porticoZ, 14));
    houseGroup.add(cyl(0.46, 0.4, 0.22, TRIM, cx, 0.14, porticoZ, 14));
  });

  // pediment (triangular roof over portico)
  var pedGeo = new THREE.ConeGeometry(1, 1.9, 3, 1);
  pedGeo.rotateY(Math.PI/6);
  var pediment = mesh(pedGeo, TRIM, {roughness:0.5});
  pediment.scale.set(4.7, 1, 1.15);
  pediment.rotation.z = Math.PI/2 * 0; // keep upright
  pediment.rotation.x = 0;
  pediment.rotation.y = Math.PI/2;
  pediment.position.set(0, 6.55, porticoZ - 0.1);
  houseGroup.add(pediment);

  var porticoRoofSlab = box(8.4, 0.35, 1.9, TRIM, 0, 5.85, porticoZ - 0.1);
  houseGroup.add(porticoRoofSlab);

  // grand double door
  houseGroup.add(box(2.6, 3.6, 0.22, DOOR, 0, 2.0, 4.9));
  houseGroup.add(box(0.08, 3.6, 0.22, GOLD, 0, 2.0, 4.98, {metalness:0.6, roughness:0.3}));
  [-0.55, 0.55].forEach(function(dx){
    houseGroup.add(cyl(0.05,0.05,0.05, GOLD, dx, 2.0, 5.02, 8, {metalness:0.8, roughness:0.2}));
  });

  // ---------- windows ----------
  function addWindow(x,y,z, w,h, rotY){
    var wgroup = group();
    wgroup.add(box(w, h, 0.12, TRIM, 0,0,0));
    wgroup.add(box(w*0.82, h*0.82, 0.16, GLASS, 0,0,0.02, {metalness:0.55, roughness:0.12}));
    wgroup.add(box(0.06, h*0.82, 0.18, TRIM, 0,0,0.03));
    wgroup.add(box(w*0.82, 0.06, 0.18, TRIM, 0,0,0.03));
    wgroup.position.set(x,y,z);
    if (rotY) wgroup.rotation.y = rotY;
    houseGroup.add(wgroup);
  }

  // core block front-facing windows (flanking the portico), upper + lower
  [-6.2, -4.7, 4.7, 6.2].forEach(function(x){
    addWindow(x, 3.5, 5.02, 1.15, 1.9, 0);
    addWindow(x, 5.6, 5.02, 1.0, 1.2, 0);
  });

  // wing front windows
  [-11.1, 11.1].forEach(function(cx){
    [-1.6, 1.6].forEach(function(off){
      addWindow(cx+off, 2.6, 3.82, 1.05, 1.6, 0);
      addWindow(cx+off, 4.3, 3.82, 0.95, 1.05, 0);
    });
  });

  // side windows on core block
  [-3.2, 0, 3.2].forEach(function(z){
    addWindow(7.52, 3.5, z, 1.05, 1.7, Math.PI/2);
    addWindow(-7.52, 3.5, z, 1.05, 1.7, Math.PI/2);
  });

  estate.add(houseGroup);

  // ---------- three-car garage (attached, right side) ----------
  var garageGroup = group();
  garageGroup.add(box(9.6, 3.6, 6.6, WALL, 0, 1.8, 0));
  garageGroup.add(pyramidRoof(10.6, 2.4, 7.6, ROOFLO, 0, 3.6+1.2, 0));
  [-3.05, 0, 3.05].forEach(function(dx){
    garageGroup.add(box(2.6, 2.6, 0.14, 0xe7e2d6, dx, 1.5, 3.32, {roughness:0.6}));
    for (var p=-1; p<=1; p++){
      garageGroup.add(box(2.35, 0.06, 0.16, 0xcfc9b9, dx, 0.75+p*0.75, 3.4));
    }
  });
  garageGroup.position.set(18.4, 0, -1.2);
  garageGroup.rotation.y = 0;
  estate.add(garageGroup);
  estate.add(box(9.9,0.4,6.9, STONE, 18.4, 0.2, -1.2));
  var garageDrive = mesh(new THREE.PlaneGeometry(7.5, 9), DRIVE, {roughness:0.9, castShadow:false});
  garageDrive.rotation.x = -Math.PI/2;
  garageDrive.position.set(18.4, 0.02, 4.2);
  estate.add(garageDrive);

  // ---------- pool (left side) ----------
  var poolGroup = group();
  poolGroup.add(box(13.5, 0.3, 8, STONE, 0, 0.15, 0));
  var poolInner = mesh(new THREE.PlaneGeometry(11.8, 6.3), POOL, {roughness:0.12, metalness:0.15, castShadow:false});
  poolInner.rotation.x = -Math.PI/2;
  poolInner.position.y = 0.31;
  poolGroup.add(poolInner);
  var poolHighlight = mesh(new THREE.PlaneGeometry(4, 1.4), POOLLT, {roughness:0.1, metalness:0.1, castShadow:false});
  poolHighlight.rotation.x = -Math.PI/2;
  poolHighlight.position.set(-3, 0.32, 1.6);
  poolGroup.add(poolHighlight);
  poolGroup.position.set(-20, 0, 6);
  estate.add(poolGroup);

  // sun loungers by the pool
  [[-3.5,2.6],[-1.8,2.6]].forEach(function(p){
    var lg = group();
    lg.add(box(0.7,0.35,2.2, 0xf6f2e8, 0,0.18,0, {roughness:0.7}));
    lg.add(box(0.7,0.9,0.12, 0xf6f2e8, 0,0.6,-1.0, {roughness:0.7}));
    lg.position.set(-20+p[0], 0, 6+p[1]);
    lg.rotation.y = 0.15;
    estate.add(lg);
  });

  // ---------- landscaping ----------
  function topiary(x,z, scale){
    scale = scale || 1;
    var g = group();
    g.add(cyl(0.14,0.18,0.9,TRUNK, 0,0.45*scale,0,8));
    var topBall = mesh(new THREE.SphereGeometry(0.62*scale, 10,8), HEDGE, {roughness:0.85});
    topBall.position.y = 1.15*scale;
    g.add(topBall);
    g.position.set(x,0,z);
    return g;
  }
  function tree(x,z,scale){
    scale = scale || 1;
    var g = group();
    g.add(cyl(0.28*scale,0.36*scale,2.4*scale,TRUNK, 0,1.2*scale,0,8));
    var f1 = mesh(new THREE.SphereGeometry(1.5*scale,10,8), TREE, {roughness:0.85});
    f1.position.y = 3.0*scale; g.add(f1);
    var f2 = mesh(new THREE.SphereGeometry(1.1*scale,10,8), TREE, {roughness:0.85});
    f2.position.set(0.7*scale, 3.9*scale, 0.3*scale); g.add(f2);
    var f3 = mesh(new THREE.SphereGeometry(1.0*scale,10,8), TREE, {roughness:0.85});
    f3.position.set(-0.6*scale, 3.7*scale, -0.4*scale); g.add(f3);
    g.position.set(x,0,z);
    return g;
  }
  function palm(x,z,scale){
    scale = scale || 1;
    var g = group();
    var trunk = cyl(0.16*scale,0.24*scale,3.6*scale,0x8a6a45, 0,1.8*scale,0,7);
    trunk.rotation.z = 0.09;
    g.add(trunk);
    for (var i=0;i<6;i++){
      var frond = box(1.6*scale,0.08*scale,0.32*scale, 0x3f7a3f, 0,0,0, {roughness:0.7});
      frond.position.set(0.75*scale*Math.cos(i*Math.PI/3), 3.6*scale, 0.75*scale*Math.sin(i*Math.PI/3));
      frond.rotation.y = i*Math.PI/3;
      frond.rotation.z = -0.35;
      g.add(frond);
    }
    g.position.set(x,0,z);
    return g;
  }

  // topiary flanking entrance steps
  [[-5.2, 8.4], [5.2, 8.4], [-3.6, 8.4], [3.6, 8.4]].forEach(function(p, i){
    estate.add(topiary(p[0], p[1], i<2 ? 1.15 : 0.85));
  });

  // hedge row along driveway circle
  for (var a = 0; a < Math.PI*2; a += Math.PI/10){
    var rx = Math.sin(a) * 17.5, rz = 24 + Math.cos(a) * 17.5;
    if (rz > 16) estate.add(topiary(rx, rz, 0.7));
  }

  // shade trees around the lawn
  var treeSpots = [
    [-30,-14,1.3],[28,-16,1.2],[-34,22,1.1],[32,30,1.3],
    [-16,-20,1.0],[20,-22,1.1],[-26,42,1.0],[10,48,1.2],[-6,52,1.0]
  ];
  treeSpots.forEach(function(t){ estate.add(tree(t[0],t[1],t[2])); });

  // palms around the pool
  [[-26.5,2],[-26.5,10],[-13.5,10]].forEach(function(p){
    estate.add(palm(p[0], p[1], 1.05));
  });

  // low garden wall + gate posts at driveway mouth
  estate.add(box(0.6,1.1,0.6, STONE, -4.6, 0.55, 52));
  estate.add(box(0.6,1.1,0.6, STONE, 4.6, 0.55, 52));
  estate.add(cyl(0.32,0.32,0.4, GOLD, -4.6, 1.32, 52, 8, {metalness:0.6, roughness:0.3}));
  estate.add(cyl(0.32,0.32,0.4, GOLD, 4.6, 1.32, 52, 8, {metalness:0.6, roughness:0.3}));
  for (var wx = -28; wx <= -6.2; wx += 2.4){
    estate.add(box(2.1,0.75,0.4, STONE, wx, 0.38, 52));
  }
  for (wx = 6.2; wx <= 28; wx += 2.4){
    estate.add(box(2.1,0.75,0.4, STONE, wx, 0.38, 52));
  }

  // ---------- render loop ----------
  var isNight = false;
  var clock = new THREE.Clock();

  function setDay(){
    isNight = false;
    skyUniforms.topColor.value.set(0x6fa8dc);
    skyUniforms.bottomColor.value.set(0xdfeaf2);
    scene.fog.color.set(0xdfeaf2);
    hemi.intensity = 0.65;
    hemi.color.set(0xcfe3f5);
    sun.intensity = 1.15;
    sun.color.set(0xfff3d6);
    fill.intensity = 0.28;
    document.body.style.background = '#dfeaf2';
  }
  function setNight(){
    isNight = true;
    skyUniforms.topColor.value.set(0x0b1a33);
    skyUniforms.bottomColor.value.set(0x1c2b4a);
    scene.fog.color.set(0x14213a);
    hemi.intensity = 0.28;
    hemi.color.set(0x243a5e);
    sun.intensity = 0.35;
    sun.color.set(0xaebfe0);
    fill.intensity = 0.12;
    document.body.style.background = '#0b1622';
  }
  setDay();

  // warm window glow lights (toggle emissive at night)
  var glowMats = [];
  houseGroup.traverse(function(o){
    if (o.isMesh && o.material && o.material.color && o.material.color.getHex() === GLASS){
      glowMats.push(o.material);
    }
  });
  function updateGlass(){
    glowMats.forEach(function(m){
      if (isNight){ m.emissive = new THREE.Color(0xffdca0); m.emissiveIntensity = 0.9; }
      else { m.emissive = new THREE.Color(0x000000); m.emissiveIntensity = 0; }
    });
  }

  document.getElementById('toggleTime').addEventListener('click', function(){
    if (isNight){ setDay(); this.textContent = '🌙 Night'; }
    else { setNight(); this.textContent = '☀️ Day'; }
    updateGlass();
  });
  document.getElementById('toggleSpin').addEventListener('click', function(){
    controls.autoRotate = !controls.autoRotate;
    this.textContent = controls.autoRotate ? '⏸ Pause orbit' : '▶ Resume orbit';
  });

  function animate(){
    requestAnimationFrame(animate);
    var t = clock.getElapsedTime();
    fountainTop.position.y = 3.55 + Math.sin(t*2)*0.03;
    controls.update();
    renderer.render(scene, camera);
  }

  function onResize(){
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w,h);
  }
  window.addEventListener('resize', onResize);

  animate();

  var loadEl = document.getElementById('loading');
  setTimeout(function(){
    loadEl.classList.add('hide');
    setTimeout(function(){ loadEl.style.display = 'none'; }, 650);
  }, 450);

})();
</script>
</body>
</html>
